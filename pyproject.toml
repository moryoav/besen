# Tool settings for the HACS integration. Test dependencies are listed in
# requirements_test.txt, and the besen library version comes from the
# integration manifest. The library itself lives in moryoav/py-besen.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["custom_components/besen"]
omit = [
  "custom_components/besen/translations/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "DTZ", "E", "F", "FA", "I", "ICN", "N", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "T20", "UP", "W"]
ignore = ["ASYNC109", "N818"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
known-first-party = ["custom_components.besen"]
known-third-party = ["besen"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true
files = ["custom_components/besen", "tests/integration/test_migration.py"]
exclude = ["build", "dist", "besen.egg-info", "besen_bs20.egg-info", "ha_besen_bs20.egg-info"]

[[tool.mypy.overrides]]
module = ["bleak.*", "bleak_retry_connector.*"]
ignore_missing_imports = true

# Core does not type-check its integration test suite; check the integration and
# HACS upgrade tests here, and run the complete Core-derived tests with pytest.
[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true

# Stable HA 2026.9.2 still annotates async_show_form with voluptuous.Schema.
# The accepted Core implementation uses probatio.Schema and is checked byte for
# byte by check_core_alignment.py, plus exercised on stable HA in integration tests.
[[tool.mypy.overrides]]
module = ["custom_components.besen.config_flow"]
disable_error_code = ["arg-type"]

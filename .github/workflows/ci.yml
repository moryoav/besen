name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            custom_components/besen/manifest.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          # shellcheck disable=SC2046 # Install each manifest requirement as its own argument.
          pip install $(python -c "import json; print(*json.load(open('custom_components/besen/manifest.json'))['requirements'])")
      - name: Check Core alignment
        run: python scripts/check_core_alignment.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest --cov -q

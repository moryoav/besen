name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate the complete Besen override
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            --entrypoint python3 \
            ghcr.io/home-assistant/hassfest \
            /github/workspace/scripts/run_hassfest.py
